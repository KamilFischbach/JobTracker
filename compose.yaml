services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobtracker_user -d jobtracker']
      interval: 5s
      timeout: 5s
      retries: 5

  # Automation: reads Gmail, classifies emails with the local LLM and calls
  # the JobTracker API. Optional, start with:
  # docker compose --profile automation up -d
  # then open http://localhost:5678
  n8n:
    image: n8nio/n8n:2.45.5
    profiles: ['automation']
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      GENERIC_TIMEZONE: Europe/Warsaw
      TZ: Europe/Warsaw
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    # The API and Ollama run on the host machine, outside Docker.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # Workflows, credentials and the key that encrypts them.
      - n8n_data:/home/node/.n8n

  # Optional local AI for "Fill with AI". Skip it if Ollama is installed on
  # the machine already. Start with: docker compose --profile ai up -d
  # then pull the model: docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    profiles: ['ai']
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment to use an NVIDIA GPU (needs the NVIDIA Container Toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
  ollama_models:
  n8n_data:
